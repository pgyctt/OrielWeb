name: release

# 发布：推送 v* 标签（或手动触发，需选一个 v* 标签的 ref）。
# 产物：GitHub Release（NuGet 包 + 三平台 demo 单文件）+ nuget.org。
# 前置：仓库 Secrets 里配置 NUGET_API_KEY（nuget.org 的 Push API Key）；
#       未配置时工作流在最后一步失败，但 Release 资产已在上传完毕（推 NuGet 放在最后）。
# 版本号唯一来源是根 Directory.Build.props 的 <Version>；
# 标签必须与之一致（形如 vX.Y.Z 对应 X.Y.Z），下面的校验步骤会拦截不一致的发布。
#
# demo 按平台拆成三个 runner：NativeAOT 不支持跨操作系统编译，三个平台的产物只能在各自的
# runner 上产出（依赖与 ci.yml 的 compile-* 一致）。汇总只做一次——三个 runner 各推一次
# NuGet 会互相抢，同名 Release 资产也会互相覆盖，所以挂资产与推包都放在最后的 publish job。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # 上传 Release 资产需要写权限
  contents: write

jobs:
  demo:
    # 三平台各自发布自己的 demo。资产名按 RID 区分：AOT 产物是自包含的，
    # 同名文件混在一起会互相覆盖。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: OrielDemo.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: OrielDemo
          - os: macos-latest
            rid: osx-arm64
            exe: OrielDemo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        # WebKitGTK/GTK 的头文件与 .pc 是编译期要用的；zlib1g-dev 与 clang 是 Native AOT 的前置
        # （runner 通常已带，显式列出以免依赖镜像）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev zlib1g-dev clang

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish demo (${{ matrix.rid }})
        # DebugType=none：不带 pdb/dbg/dSYM，三个平台的包都只留可执行文件
        run: dotnet publish samples/OrielDemo -c Release -r ${{ matrix.rid }} -p:DebugType=none -o dist/demo

      - name: Check output
        # 与 ci.yml 的 compile-* 同款断言：退出码为 0 但产物缺失是可能的，与其让人去目录里翻，
        # 不如在这里说清楚。顺带把体积打进日志，包明显变大时才看得到。
        shell: pwsh
        run: |
          $exe = Join-Path dist/demo '${{ matrix.exe }}'
          if (-not (Test-Path $exe)) { throw "AOT 产物缺失：$exe" }
          Write-Output "demo ${{ matrix.rid }}: $([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

      - name: Read version
        id: version
        # 版本号唯一来源是根 Directory.Build.props：产物文件名与 Info.plist 都用它
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $value = @($props.Project.PropertyGroup.Version)[0].Trim()
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        # .AppImage 需要一个外部工具，而它本身是 AppImage；CI 里没有 FUSE，
        # 所以调用时靠 APPIMAGE_EXTRACT_AND_RUN=1（见下面 bundle 步骤的 env）。
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> $GITHUB_PATH

      - name: Bundle the installer
        # 本仓库自己吃自己的工具：三平台各出该平台的安装产物（.msi / .dmg / .AppImage）。
        # 发布只交给 dotnet publish、打包只交给 oriel bundle —— 也就是使用者要走的那条路径
        # （macOS 的 .app 组装也从 tools/make-macos-app.sh 搬进了 CLI，一个实现者）。
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: pwsh
        run: |
          dotnet run --project src/OrielWeb.Cli -c Release -- bundle `
            --dir dist/demo --rid ${{ matrix.rid }} --name "Oriel Demo" --id com.orielweb.demo `
            --icon samples/OrielDemo/app.png --version ${{ steps.version.outputs.value }} --out dist/bundle

      - name: Verify the MSI (Windows)
        # 产物自验：这条路径以前从来没被跑过——"能不能装、装完文件在不在、卸得干净吗"
        # 恰好都是机器可判定的，而它们也是发布产物最容易悄悄坏掉的地方。
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/bundle -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "没有产出 .msi" }
          $install = Start-Process msiexec -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI 安装失败（退出码 $($install.ExitCode)）" }

          $installed = "$env:LOCALAPPDATA\Programs\Oriel Demo"
          if (-not (Test-Path "$installed\OrielDemo.exe")) { throw "安装后找不到 $installed\OrielDemo.exe" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Oriel Demo\Oriel Demo.lnk")) {
            throw "安装后没有开始菜单快捷方式"
          }
          Write-Output "OK：MSI 装得上"

          Start-Process msiexec -ArgumentList "/x", "`"$($msi.FullName)`"", "/qn", "/norestart" -Wait | Out-Null
          if (Test-Path $installed) { throw "卸载后安装目录仍然存在" }
          Write-Output "OK：卸得干净"

      - name: Verify the dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/bundle/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "没有产出 .dmg"; exit 1; }
          mount=/tmp/oriel-dmg
          rm -rf "$mount"; mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          app="$mount/Oriel Demo.app"
          test -x "$app/Contents/MacOS/OrielDemo" || { echo "挂载后缺少可执行文件"; exit 1; }
          test -f "$app/Contents/Info.plist" || { echo "挂载后缺少 Info.plist"; exit 1; }
          # CFBundleIdentifier 缺失时 WKWebView 会直接 __builtin_trap（退出码 133），
          # 所以这里不是"文件在不在"，而是把它读出来核对。
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")
          [ "$bundle_id" = "com.orielweb.demo" ] || { echo "CFBundleIdentifier 不对：$bundle_id"; exit 1; }
          codesign -dv "$app" 2>&1 | head -3
          hdiutil detach "$mount"
          echo "OK：dmg 挂得上，.app 与 bundle identifier 都正确"

      - name: Verify the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls dist/bundle/*.AppImage | head -1)
          [ -n "$appimage" ] || { echo "没有产出 .AppImage"; exit 1; }
          chmod +x "$appimage"
          rm -rf /tmp/squashfs-root
          # --appimage-extract 是自解包，不需要 FUSE（CI 里也没有）
          (cd /tmp && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          test -x /tmp/squashfs-root/AppRun || { echo "解包后缺少 AppRun"; exit 1; }
          test -x /tmp/squashfs-root/usr/bin/OrielDemo || { echo "解包后找不到可执行文件"; exit 1; }
          test -f /tmp/squashfs-root/*.desktop || { echo "解包后缺少 .desktop"; exit 1; }
          grep -q '^Exec=OrielDemo$' /tmp/squashfs-root/*.desktop || { echo ".desktop 的 Exec 不对"; exit 1; }
          grep -q '^X-AppImage-Version=' /tmp/squashfs-root/*.desktop || { echo ".desktop 缺少版本"; exit 1; }
          echo "OK：AppImage 解包后 AppRun、可执行文件与 .desktop 都在"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/demo/*' -DestinationPath 'dist/OrielWeb-demo-${{ matrix.rid }}.zip' -Force

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        # 用系统的 zip 而不是 Compress-Archive：后者在 Linux/macOS 上不保留 Unix 权限位，
        # 解压出来的可执行文件会丢掉可执行位。
        run: |
          cd dist/demo
          zip -r "../OrielWeb-demo-${{ matrix.rid }}.zip" .

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        # 只打包 .app：裸可执行文件在 macOS 上跑不起来，放进去只会让人以为有两条路。
        # .app 现在由 oriel bundle 组装（原先的 tools/make-macos-app.sh 已删除，一个实现者）。
        run: |
          cd dist/bundle
          zip -r "../OrielWeb-demo-${{ matrix.rid }}.zip" "Oriel Demo.app"

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.rid }}
          path: |
            dist/OrielWeb-demo-${{ matrix.rid }}.zip
            dist/bundle/*
          # 这里没找到 zip 就是构建出了问题，不能静默跳过
          if-no-files-found: error
          # artifact 只是中转，最终资产挂在 Release 上（永久保留）
          retention-days: 7

  publish:
    # 等三个平台的 demo 都产出再汇总：needs 保证任一平台失败就不会发出半套资产
    needs: [demo]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        # 发布前再跑一遍（tag 推送不会触发 ci.yml 的 push 触发器）
        run: dotnet test tests/OrielWeb.Tests -c Release

      - name: Pack
        # 只产 OrielWeb 一个包：生成器已并入主包的 analyzers/dotnet/cs
        run: dotnet pack OrielWeb.slnx -c Release -o dist/nuget

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0].Trim()
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($tag -ne $version) {
            throw "标签 v$tag 与包版本 $version 不一致：先改 Directory.Build.props 的 Version，再打对应标签"
          }
          Write-Output "版本一致：$version"

      - name: Download the demo zips
        uses: actions/download-artifact@v4
        with:
          pattern: demo-*
          path: dist
          # 三个 artifact 里各有一个不同名的 zip，合并到 dist/ 即可
          merge-multiple: true

      - name: Attach assets to the GitHub release
        # 放在推 NuGet 之前：推送失败（如未配置 NUGET_API_KEY）不影响 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nuget/*.nupkg
            dist/nuget/*.snupkg
            dist/*.zip
            dist/bundle/*.msi
            dist/bundle/*.dmg
            dist/bundle/*.AppImage

      - name: Push to nuget.org
        # 通配符必须由 shell 展开：PowerShell 不会给原生命令展开参数里的 *，
        # 而 dotnet nuget push 自己也不展开——"dist/nuget/*.nupkg" 会被当成一个文件名，
        # 于是报 "File does not exist"。这里显式列出文件，顺带在没有产物时
        # 给出比"文件不存在"更清楚的错误。
        # --skip-duplicate：重复推送同一版本不再报错（幂等）
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path dist/nuget -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "dist/nuget 里没有 nupkg——先确认上一步 Pack 的产物"
          }
          Write-Output "推送 $($packages.Count) 个包：$($packages.Name -join ', ')"
          dotnet nuget push $packages.FullName --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
