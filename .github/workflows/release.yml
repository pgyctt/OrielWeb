name: release

# 发布：推送 v* 标签（或手动触发——只有选了 v* 标签 ref 才会真正发布，
# 其余 ref 下 publish job 直接跳过）。
# 产物：GitHub Release（NuGet 包 + 三平台 demo 单文件）+ nuget.org。
# 前置（nuget.org 的 Trusted Publishing，仓库里不再有长期 API key）：
#   1. nuget.org → Trusted Publishing 建一条 policy：Repository Owner=pgyctt、
#      Repository=OrielWeb、Workflow File=release.yml（只填文件名，Environment 留空）；
#   2. 仓库 Secrets 里配 NUGET_USER：nuget.org 的**用户名**（profile name），不是邮箱。
#      它不是凭据（授权由 OIDC token + policy 完成），放 secret 只是为了不在日志里明文出现。
#   缺任一项时工作流在最后一步失败，但 Release 资产已在上传完毕（推 NuGet 放在最后）。
# 版本号唯一来源是根 Directory.Build.props 的 <Version>；
# 标签必须与之一致（形如 vX.Y.Z 对应 X.Y.Z），下面的校验步骤会拦截不一致的发布。
#
# demo 按平台拆成三个 runner：NativeAOT 不支持跨操作系统编译，三个平台的产物只能在各自的
# runner 上产出（依赖与 ci.yml 的 compile-* 一致）。汇总只做一次——三个 runner 各推一次
# NuGet 会互相抢，同名 Release 资产也会互相覆盖，所以挂资产与推包都放在最后的 publish job。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # 上传 Release 资产需要写权限
  contents: write
  # 读同 commit 的 CI 结论（发布闸：「Require green CI on this commit」那一步）
  actions: read

# 快速连推两个 tag 时不并发跑：两次运行的同名 Release 资产会互相覆盖
# （NuGet 侧另有 --skip-duplicate 兜底）。排队串行即可，不取消进行中的那次。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  demo:
    # 三平台各自发布自己的 demo。资产名按 RID 区分：AOT 产物是自包含的，
    # 同名文件混在一起会互相覆盖。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: OrielDemo.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: OrielDemo
          - os: macos-latest
            rid: osx-arm64
            exe: OrielDemo
    runs-on: ${{ matrix.os }}
    # 与 ci.yml 的 compile-* 同档上限。默认超时是 6 小时：缺了这一行，一次 apt/网络挂起
    # 会把发版拖到天亮——而 release 是串行不取消的，卡住的那次会挡住后面所有 tag。
    # AOT 发布比 CI 的纯编译重（三平台各自要 2 分钟左右），留三倍余量足够。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Install dependencies
        if: runner.os == 'Linux'
        # WebKitGTK/GTK 的头文件与 .pc 是编译期要用的；zlib1g-dev 与 clang 是 Native AOT 的前置
        # （runner 通常已带，显式列出以免依赖镜像）
        #
        # 与 ci.yml 的 compile-linux **逐字对齐**（外层 timeout + 三次重试）：
        # 这里此前是裸的 apt-get，一次镜像抖动就能让整个发版停在这儿——
        # 而发版是串行不取消的（concurrency.cancel-in-progress: false），
        # 卡住的那次会挡住后面所有 tag。Acquire 参数管不到"等 mirror 应答/DNS/锁"，
        # 只有进程级硬超时能兜住（2026-10-23 那次挂了 25 分钟以上）。
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          APT_PACKAGES="libwebkit2gtk-4.1-dev libgtk-3-dev zlib1g-dev clang"
          for attempt in 1 2 3; do
            echo "::group::apt 第 ${attempt} 次"
            if timeout 240 sudo apt-get update $APT_OPTS &&
               timeout 360 sudo apt-get install -y $APT_OPTS $APT_PACKAGES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 ${attempt} 次 apt 失败，10 秒后重试" >&2
            sleep 10
          done
          echo "apt 连续三次失败，判定为 runner/镜像故障" >&2
          exit 1

      - name: Publish demo (${{ matrix.rid }})
        # DebugType=none：不带 pdb/dbg/dSYM，三个平台的包都只留可执行文件
        run: dotnet publish samples/OrielDemo -c Release -r ${{ matrix.rid }} -p:DebugType=none -o dist/demo

      - name: Check output
        # 与 ci.yml 的 compile-* 同款断言：退出码为 0 但产物缺失是可能的，与其让人去目录里翻，
        # 不如在这里说清楚。顺带把体积打进日志，包明显变大时才看得到。
        shell: pwsh
        run: |
          $exe = Join-Path dist/demo '${{ matrix.exe }}'
          if (-not (Test-Path $exe)) { throw "AOT 产物缺失：$exe" }
          Write-Output "demo ${{ matrix.rid }}: $([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

      - name: Read version
        id: version
        # 版本号唯一来源是根 Directory.Build.props：产物文件名与 Info.plist 都用它
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $value = @($props.Project.PropertyGroup.Version)[0].Trim()
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Assemble the macOS app bundle
        # Velopack 在 macOS 上消费的是 .app（入口点来自它的 Info.plist），而 dotnet publish 只给一个
        # 裸可执行文件——组装仍由 tools/make-macos-app.sh 做（CLI 里那份实现随 CLI 一起撤掉了）。
        if: runner.os == 'macOS'
        run: bash tools/make-macos-app.sh dist/demo/OrielDemo dist "${{ steps.version.outputs.value }}"

      - name: Pack with Velopack
        # 打包交给 vpk：三平台各出自己的那一套（Windows 的 Setup.exe / Portable.zip，外加
        # --msi 的引导包）。发布仍然只交给 dotnet publish，vpk 只消费它的产物——
        # 与使用者要走的那条路径一致。
        shell: pwsh
        run: |
          # 与 ci.yml 同一个钉法：vpk 的产物形态随版本变，升级要显式做
          dotnet tool install --global vpk --version 1.2.*
          # dotnet 全局工具落在 <家目录>/.dotnet/tools，而"家目录"与 PATH 分隔符三平台各不相同：
          # 原先写的 "$env:USERPROFILE\.dotnet\tools" 在 macOS/Linux 上 $env:USERPROFILE 是空的、
          # PATH 用的也是 ':' 而不是 ';'——拼出来的条目根本不是 vpk 所在的位置。
          $env:PATH = @($env:PATH, (Join-Path $HOME '.dotnet/tools')) -join [IO.Path]::PathSeparator
          if (-not (Get-Command vpk -ErrorAction SilentlyContinue)) { throw "vpk 不在 PATH 上" }

          $packDir = 'dist/demo'
          $extra = @()
          if ('${{ runner.os }}' -eq 'macOS') { $packDir = 'dist/OrielDemo.app' }
          if ('${{ runner.os }}' -eq 'Windows') {
            $extra += @('--mainExe', 'OrielDemo.exe', '--msi', '--icon', 'samples/OrielDemo/app.ico')
          }
          if ('${{ runner.os }}' -eq 'Linux') { $extra += @('--icon', 'samples/OrielDemo/app.png') }
          # macOS 刻意不给 --icon：vpk 在 macOS 上认的是 .icns（我们只有 .ico/.png），
          # 而 --icon 并非必填（--help 里只有 --packDir 标了 REQ）——图标该由 .app 自己带；
          # 真应用要图标就用 app.png 生成 .icns 放进 bundle（见 README 的打包一节）。
          # 2026-10-02：第一次带 .png 跑 macOS 打包就折在这一步。

          $output = vpk pack --packId OrielDemo --packVersion "${{ steps.version.outputs.value }}" `
            --packTitle "Oriel Demo" --packAuthors "OrielWeb Contributors" `
            --packDir $packDir --outputDir dist/releases --skip-updates -x -y @extra 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            # vpk 的失败原因只在它自己的输出里，而日志要 token 才能读——注解不用。
            # 把最后几行拼进注解，下一次失败就能直接看到原因（与 ci.yml 的冒烟步骤同一个理由）。
            # vpk 先打错误信息、再打一串 "   at Velopack…" 栈帧。只取非栈帧的行：
            # 否则注解里留下的全是 frames（0.1.6 那次就是这样，等于白丢一轮）。
            $meaningful = $output |
              Where-Object { "$_".Trim() } |
              Where-Object { "$_" -notmatch '^\s+at ' }
            $tail = ($meaningful | Select-Object -Last 3) -join ' / '
            Write-Output "::error title=vpk pack 失败（${{ runner.os }}，退出码 $code）::$tail"
            throw "vpk pack 失败（退出码 $code）"
          }

          # 更新包（*.nupkg）与更新清单（releases.*.json / assets.*.json / RELEASES*）都不要：
          # 本仓库不发更新源，清单还会指向一个已被删掉的包
          Get-ChildItem dist/releases -File | Where-Object {
            $_.Extension -in '.nupkg', '.json' -or $_.Name -like 'RELEASES*'
          } | Remove-Item -Force

      - name: Show the release artifacts
        # 这一版打包链首次上线，各平台的产物名不尽相同——先把**实际产出了什么**打进日志。
        # 断言只钉"该有的在、不该有的不在"：Windows 与 Linux 的产物名已实测过，macOS 的还没跑过，
        # 所以那里只要求目录非空（第一次跑完就能从日志里看到它究竟出什么）。
        shell: pwsh
        run: |
          if (-not (Test-Path dist/releases)) { throw "vpk 什么都没产出" }
          $files = Get-ChildItem dist/releases -Recurse -File
          if ($files.Count -eq 0) { throw "dist/releases 是空的" }
          foreach ($file in $files) {
            Write-Output ("  {0}（{1} KB）" -f $file.Name, [Math]::Round($file.Length/1KB, 0))
          }

          # 不该有的：更新包与更新清单（上一步已删，这里把它变成约定）
          $leftover = $files | Where-Object {
            $_.Extension -in '.nupkg', '.json' -or $_.Name -like 'RELEASES*'
          }
          if ($leftover) { throw "不该有更新包/清单：$($leftover.Name -join ', ')" }

          # 该有的：本平台至少要有一份"能装的东西"
          if ('${{ runner.os }}' -eq 'Windows' -and -not (Get-ChildItem dist/releases -Filter '*-Setup.exe')) {
            throw "缺少 Setup.exe"
          }
          if ('${{ runner.os }}' -eq 'Linux' -and -not (Get-ChildItem dist/releases -Filter '*.AppImage')) {
            throw "缺少 AppImage"
          }
          Write-Output "OK：$($files.Count) 个产物（更新包与清单已按约定清除）"

      - name: Verify the macOS app bundle
        # .app 是我们自己组装的（Velopack 消费它），所以它仍然归我们验证：
        # CFBundleIdentifier 缺失时 WKWebView 会直接 __builtin_trap（退出码 133），
        # 所以这里不是"文件在不在"，而是把它读出来核对。
        if: runner.os == 'macOS'
        run: |
          app="dist/OrielDemo.app"
          test -x "$app/Contents/MacOS/OrielDemo" || { echo "缺少可执行文件"; exit 1; }
          test -f "$app/Contents/Info.plist" || { echo "缺少 Info.plist"; exit 1; }
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")
          [ "$bundle_id" = "com.orielweb.demo" ] || { echo "CFBundleIdentifier 不对：$bundle_id"; exit 1; }
          codesign -dv "$app" 2>&1 | head -3
          echo "OK：.app 装得上、bundle identifier 正确"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/demo/*' -DestinationPath 'dist/OrielWeb-demo-${{ matrix.rid }}.zip' -Force

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        # 用系统的 zip 而不是 Compress-Archive：后者在 Linux/macOS 上不保留 Unix 权限位，
        # 解压出来的可执行文件会丢掉可执行位。
        run: |
          cd dist/demo
          zip -r "../OrielWeb-demo-${{ matrix.rid }}.zip" .

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        # 只打包 .app：裸可执行文件在 macOS 上跑不起来，放进去只会让人以为有两条路。
        # .app 由 tools/make-macos-app.sh 组装（Velopack 的产物是另一条路，两个都给）。
        run: |
          cd dist
          zip -r "OrielWeb-demo-${{ matrix.rid }}.zip" "OrielDemo.app"

      - name: Upload demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-${{ matrix.rid }}
          path: |
            dist/OrielWeb-demo-${{ matrix.rid }}.zip
            dist/releases/*
          # 这里没找到 zip 就是构建出了问题，不能静默跳过
          if-no-files-found: error
          # artifact 只是中转，最终资产挂在 Release 上（永久保留）
          retention-days: 7

  publish:
    # 等三个平台的 demo 都产出再汇总：needs 保证任一平台失败就不会发出半套资产
    needs: [demo]
    # workflow_dispatch 可以从任意分支 ref 触发：发布链只对 v* 标签生效。不加这条，
    # 手动触发会把未打 tag 的版本照常发上 nuget.org——下面的版本闸步骤只在 tag ref 下
    # 运行，拦不住那条路。非 tag ref 时本 job 显示为 skipped，属预期。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    # 汇总 job 是串行发布链的最后一环：卡住的话 GitHub Release 与 nuget.org 都发不出去。
    # 它自己要跑测试 + 打包 + 推 NuGet，0.5.x 的实测约 2 分钟，给 20 分钟上限。
    timeout-minutes: 20
    # job 级 permissions 是**整体覆盖**顶层的声明，不是合并——所以三项都要重写，
    # 少写哪一项就等于把那一项降成 none：
    #   contents: write —— checkout 与挂 Release 资产；
    #   actions: read   —— 「Require green CI」用 gh run list 读同 commit 的结论；
    #   id-token: write —— Trusted Publishing 换临时 key；缺了它 NuGet/login 直接 403。
    # 只在这一 job 申请 OIDC：上面 demo job 不需要，最小权限不外扩。
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 缓存与 SDK 两步走 composite：本文件原先手写了两份与 ci.yml 逐字符相同的样板——
      # composite 的存在理由就是"改缓存键要改 7 遍"，手写版会在下一次改键时静默分叉。
      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Require green CI on this commit
        # **发布闸：同 commit 的 CI 必须绿，否则拒绝发布。**
        #
        # 为什么需要它：本工作流由 tag 推送触发，与 ci.yml 是**两条独立的运行**。
        # 下面那条 Test 只覆盖单测，而 CI 还跑三平台 smoke（真机自检）。
        # 0.3.6 就是在这个缺口下发出去的：smoke-macos 当时已红（tray-js 崩溃），
        # 但 release 只看版本号一致就把包推上了 nuget.org——用户拿到的是崩溃版本。
        #
        # 两个细节：
        #   * tag 推送与 main 的 push 几乎同时发生，CI 通常还没跑完，所以这里要**等**；
        #   * 等不到（该 commit 没触发过 CI，例如给旧提交补 tag）按失败处理——
        #     "没验过"与"验过且通过"不是一回事，静默放行等于把闸门又拆了。
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ github.sha }}"
          # 60 分钟：CI 自己的单 job 超时就给到 20-40 分钟（smoke-macos 30、benchmark 40），
          # 三平台矩阵加排队整条跑完常超 20 分钟——上限小于被等对象的最坏时长，
          # 意味着"tag 与 commit 同时推送"这种最正常的用法会被误判成失败（2026-10-25 评审 P2）。
          $deadline = (Get-Date).AddMinutes(60)
          Write-Output "等待 commit $sha 的 CI 结论（最多 60 分钟）…"
          while ((Get-Date) -lt $deadline) {
            $runs = gh run list --commit $sha --workflow ci.yml --limit 1 --json status,conclusion,url | ConvertFrom-Json
            if ($runs.Count -eq 0) {
              Write-Output "尚无针对该 commit 的 CI 运行，30s 后重试…"
              Start-Sleep -Seconds 30
              continue
            }
            $run = $runs[0]
            Write-Output "status=$($run.status) conclusion=$($run.conclusion) $($run.url)"
            if ($run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') {
                throw "该 commit 的 CI 结论是 $($run.conclusion)，拒绝发布。先修好 CI 再打 tag（详见 $($run.url)）"
              }
              Write-Output "CI 已绿：允许发布"
              exit 0
            }
            Start-Sleep -Seconds 30
          }
          throw "等待 CI 超时（60 分钟）：该 commit 可能没有触发过 ci.yml。拒绝发布——'没验过'不能当成'验过'。"

      - name: Test
        # 发布前再跑一遍（tag 推送不会触发 ci.yml 的 push 触发器）
        run: dotnet test tests/OrielWeb.Tests -c Release

      - name: Pack
        # 只产 OrielWeb 一个包：生成器已并入主包的 analyzers/dotnet/cs
        run: dotnet pack OrielWeb.slnx -c Release -o dist/nuget

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0].Trim()
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($tag -ne $version) {
            throw "标签 v$tag 与包版本 $version 不一致：先改 Directory.Build.props 的 Version，再打对应标签"
          }

          # CHANGELOG 闸：版本号改了但 CHANGELOG 忘了补条目，按当前发布频率（月发 29 版）
          # 漂移只是时间问题。条目形如 `## 0.5.0`（文件里真实存在的一行，见文件头）。
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## $([regex]::Escape($version))\b") {
            throw "CHANGELOG.md 里没有 `## $version` 的条目：发布 = 改版本 + 补 CHANGELOG + 打 tag 三连，缺一不可"
          }

          # @orielweb/api 的版本闸。
          #
          # 这个包**不随本 workflow 发布**（它走手工 `npm publish`），所以它的版本
          # 此前完全没有被这条链路校验过——0.5.5 发版时就发现它与主包只是"碰巧一致"
          # （靠人手同步三处：package.json + package-lock.json 的顶层与 packages[""]）。
          # npm 上的版本一旦发出去撤不回，而"主包 0.5.6、JS 包停在 0.5.5"这种漂移
          # 不会报错，只会让消费者装到不匹配的组合。这里把它纳入同一道闸。
          $apiManifest = Get-Content packages/api/package.json -Raw | ConvertFrom-Json
          if ($apiManifest.version -ne $version) {
            throw "packages/api/package.json 的版本（$($apiManifest.version)）与主包（$version）不一致：" +
                  "两处必须同步，否则 npm 上会出现不匹配的组合"
          }

          # package-lock 里有两处版本（顶层与 packages[""]），手改时容易漏掉一处。
          $lock = Get-Content packages/api/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne $version) {
            throw "packages/api/package-lock.json 顶层版本（$($lock.version)）与主包（$version）不一致"
          }
          if ($lock.packages[''].version -ne $version) {
            throw "packages/api/package-lock.json 的 packages[''].version（$($lock.packages[''].version)）与主包（$version）不一致"
          }

          Write-Output "版本一致：$version（Directory.Build.props / CHANGELOG / packages/api 三处）"

      - name: Download the demo zips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: demo-*
          path: dist
          # 三个 artifact 里各有一个不同名的 zip，合并到 dist/ 即可
          merge-multiple: true

      - name: Attach assets to the GitHub release
        # 放在推 NuGet 之前：推送失败（policy 没建好、NUGET_USER 没配、OIDC 被拒）
        # 不影响已经挂好的 Release 资产
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/nuget/*.nupkg
            dist/nuget/*.snupkg
            dist/*.zip
            dist/releases/*

      # 取临时 API key（Trusted Publishing）：把 GitHub 的 OIDC token 交给 nuget.org，
      # 由它按 Trusted Publishing policy 校验后换发一把约 1 小时有效的 key——
      # 仓库与 runner 里都不再有长期凭据，也就不存在"忘了轮换"这回事。
      #
      # **必须紧贴 push**：上面的「Require green CI」最坏要等满 60 分钟，而 key 的有效期
      # 恰好也是 1 小时——login 若放在 job 开头，等 CI 等完 key 已经过期，
      # 表现是 push 报 401/403，看起来像 policy 配错。
      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # nuget.org 的**用户名**（profile name），不是邮箱
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # 通配符必须由 shell 展开：PowerShell 不会给原生命令展开参数里的 *，
        # 而 dotnet nuget push 自己也不展开——"dist/nuget/*.nupkg" 会被当成一个文件名，
        # 于是报 "File does not exist"。这里显式列出文件，顺带在没有产物时
        # 给出比"文件不存在"更清楚的错误。
        # --skip-duplicate：重复推送同一版本不再报错（幂等）
        shell: pwsh
        # 凭据走 env 而不是模板插值：插值进命令行的值对进程列表可见，且值里若含引号/$
        # 会参与 pwsh 语义解析。GitHub 日志脱敏只挡精确匹配——env 是标准做法（同 job 的
        # GH_TOKEN 已是这种写法）。上面 login 输出的 key 已由 action 自己 setSecret。
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path dist/nuget -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "dist/nuget 里没有 nupkg——先确认上一步 Pack 的产物"
          }
          Write-Output "推送 $($packages.Count) 个包：$($packages.Name -join ', ')"
          dotnet nuget push $packages.FullName --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate

      # ---- @orielweb/api → npm（Trusted Publishing，OIDC）----
      #
      # 与上面 NuGet 那条同源：仓库里不存任何长期凭据，凭据由 GitHub 的 OIDC token
      # 换成一次性授权。npm 侧的配置在 npmjs.com 的包设置里：
      #   Package → Settings → Trusted publishing → 添加 GitHub Actions：
      #   Organization/User = pgyctt、Repository = OrielWeb、Workflow = release.yml
      #   （Environment 留空——本工作流没用 environment）
      # 没配那一条时这里会 403 且提示 "requires authentication"，看起来像 token 失效。
      #
      # **npm 版本必须显式升到 11.15.0+**：Trusted Publishing 的 OIDC 交换从 npm 11.5.1
      # 起才有，而 `npm stage publish`（本工作流用的那个）要到 11.15.0。
      # 而 actions/setup-node 装 Node 22.x 时自带的是 npm 10.x——不升级的话
      # 命令会退回找 .npmrc 里的 token，在没有 token 的 runner 上直接 ENEEDAUTH。
      # 这个失败模式很容易被误读成"OIDC 没生效"。
      #
      # `--provenance` 是 Trusted Publishing 的额外收益：npm 会给包附上可验证的
      # 构建来源（SLSA provenance），消费者能在 npmjs.com 上看到它由哪个 commit、
      # 哪个 workflow 产出。公开包免费，值得开。
      # **不要写 registry-url**。这是这次踩到的坑，值得写清楚：
      #
      # `actions/setup-node` 只要收到 `registry-url`，就会生成一份 .npmrc 并注入
      # `NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX`（占位符）与 `always-auth`。
      # 而 npm 的认证顺序是**先看 token、再看 OIDC**——一旦存在 NODE_AUTH_TOKEN，
      # 它就永远不会去做 OIDC 交换，于是以一个"有 token 但无效"的身份发 PUT。
      #
      # registry 对这种请求回的是 **404**（不是 401/403）：它不区分"包不存在"与
      # "你没权限看"，以避免被人枚举私有包名。所以错误信息看起来像"包不存在"，
      # 而真实原因是"认证方式走错了路"。
      #
      # 更迷惑的是日志里 **provenance 签名会成功**（sigstore 透明日志都写进去了）：
      # 它和 Trusted Publishing 都用同一个 id-token，但用途不同——签名成功
      # 完全不代表发布认证通过。第一次排查时正是被这两点带偏的。
      #
      # 修法：不传 registry-url（避免注入 token），改用显式 npmrc 指向官方 registry。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Upgrade npm (staged publishing needs 11.15.0+)
        # 不写 shell：Windows runner 默认 pwsh，单条命令两种 shell 都一样，
        # 而写错 shell 反而引入风险（见下面"两步而不是一条 run"的说明）。
        run: npm install -g npm@^11.15.0

      # 显式写一份**不含任何 token** 的 npmrc：registry 指向官方源，认证交给 OIDC。
      # 用 NPM_CONFIG_USERCONFIG 指向它，覆盖 setup-node 可能留下的那份。
      - name: Point npm at the public registry without a token
        shell: pwsh
        run: |
          $npmrc = Join-Path $env:RUNNER_TEMP 'npmrc-oidc'
          "registry=https://registry.npmjs.org/" | Set-Content -Path $npmrc -Encoding utf8
          # 确认真的没有凭据混进来：有 token 的话下面整条链路会退化成"未认证 PUT → 404"。
          if (Select-String -Path $npmrc -Pattern '_authToken|always-auth' -Quiet) {
            throw "生成的 npmrc 里出现了凭据字段：Trusted Publishing 要求完全不带 token"
          }
          "NPM_CONFIG_USERCONFIG=$npmrc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "npmrc: $npmrc"
          Get-Content $npmrc

      # **两步而不是一条 run 里两行**：Windows runner 的默认 shell 是 pwsh，
      # 多行 run 不会因前一条原生命令失败而中断（bash 有 -e，pwsh 没有）。
      # ci.yml 的 Frontend API 那几步就是这么拆的，0.5.x 的 CI 曾因合并写过一次而假绿：
      # "npm ci 失败 + npm test 通过"被报成绿色，直到下一步找不到本地 tsc 才炸，
      # 错误现场和真实原因隔了两步。
      - name: Frontend API deps (npm ci)
        working-directory: packages/api
        run: npm ci --ignore-scripts

      - name: Frontend API tests
        working-directory: packages/api
        run: npm test

      - name: Frontend API typecheck
        working-directory: packages/api
        run: npm run typecheck

      - name: Frontend API types are in sync
        working-directory: packages/api
        run: npm run build:types

      - name: Frontend API published types are self-consistent
        working-directory: packages/api
        run: npm run check:types

      # 类型声明必须与源码同步：build:types 重生成之后有 diff 就说明仓库里的 types/ 是旧的。
      # CI 的 test job 也查这一条；这里再查一次是因为**发出去的包就带着这份声明**——
      # npm 上的版本一旦发出去撤不回。
      - name: Frontend API types match the repo
        shell: pwsh
        run: |
          # -C 指定仓库根：working-directory 是 packages/api，而 git diff 的路径
          # 是相对仓库根写的。不指定的话在子目录里跑会报 pathspec 不存在。
          git -C "$env:GITHUB_WORKSPACE" diff --exit-code -- packages/api/types
          if ($LASTEXITCODE -ne 0) {
            throw "packages/api/types 与源码不同步：本地跑 npm run build:types 并提交"
          }

      - name: Publish @orielweb/api to npm (staged)
        working-directory: packages/api
        # 打印实际用的 npm/node 版本：Trusted Publishing 的 OIDC 交换是 npm CLI 的能力，
        # 低于门槛时会**静默退回 token 路径**（然后 404/ENEEDAUTH），日志里留下版本号
        # 比事后猜"是不是版本不够"划算得多。
        #
        # 同时打印 OIDC 环境的存在性（**不打印 token 本身**）：npm 只有在
        # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN 都存在时才会去做 OIDC 交换，
        # 这两个变量缺失时它会安静地退回 token 路径并报 ENEEDAUTH——
        # 而报错文案（"请用 npm adduser 登录"）完全指向错误的方向。
        run: |
          npm --version
          node --version
          Write-Output "OIDC request url 存在: $([bool]$env:ACTIONS_ID_TOKEN_REQUEST_URL)"
          Write-Output "OIDC request token 存在: $([bool]$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)"
          Write-Output "GITHUB_ACTIONS: $env:GITHUB_ACTIONS"
          # **--loglevel verbose 是必须的**：npm 的 OIDC 交换实现（lib/utils/oidc.js）
          # 在任何一步失败时都**静默返回 undefined**，只写 log.verbose——而调用方
          # 随后退回 token 路径、报 ENEEDAUTH。不开 verbose 就只能看到那句
          # 指向完全错误方向的 "请用 npm adduser 登录"。
          # 打开后能看到它到底卡在：入口判定 / 取 id_token / token exchange 哪一步。
          # **stage publish 而不是 publish**：npm 的 Trusted Publisher 配置默认只允许
          # 「staged publish」，「直接 publish」需要在 npmjs.com 上单独勾选。
          # 我们选择留在默认（更严）的那一侧：CI 只把包**暂存**，由人在 npm 上审批后
          # 才真正发布。多一道人工闸，但一个被攻破的 workflow 无法直接把版本推上 registry。
          #
          # 审批：npm 网站 → 包的 Staged Packages 标签页点 Approve（需 2FA），或本机跑
          #   npm stage list @orielweb/api
          #   npm stage approve <stage-id>
          npm stage publish --provenance --access public --loglevel verbose

      - name: Remind how to approve the staged package
        if: success()
        shell: pwsh
        # 这一步只是把"接下来要做什么"写进日志。stage publish 成功时 CI 会显示绿色，
        # 但**包还没上线**——不写清楚的话，"发布成功"与"用户装得到"会被混为一谈，
        # 而这正是 stage publish 最容易被误解的地方。
        run: |
          Write-Output ""
          Write-Output "================================================================"
          Write-Output " @orielweb/api 已**暂存**，尚未公开。需要人工审批："
          Write-Output ""
          Write-Output "   npm stage list @orielweb/api"
          Write-Output "   npm stage approve <stage-id>      # 需要 2FA"
          Write-Output ""
          Write-Output " 或在 https://www.npmjs.com/package/@orielweb/api 的"
          Write-Output " Staged Packages 标签页点 Approve。"
          Write-Output "================================================================"
