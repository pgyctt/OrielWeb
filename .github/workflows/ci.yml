name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OrielWeb.slnx -c Release

      - name: Test
        run: dotnet test tests/OrielWeb.Tests -c Release --no-build

      - name: Format check
        # 格式/风格/分析器门禁（基准见 .editorconfig）；src/ 另已启用 TreatWarningsAsErrors
        run: dotnet format OrielWeb.slnx --verify-no-changes --verbosity minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Bridge JS tests
        # 三平台桥接脚本（windows/macos/linux）行为一致性；P0-2/P0-3 的回归防护。
        # 注意：必须显式给出文件路径——Node 把纯目录参数当作入口模块解析。
        run: node --test tests/bridge/bridge.test.mjs

      - name: Package build logic (in-package MSBuild targets)
        # 包内 buildTransitive/OrielWeb.targets 的消费链路：打包 → 零配置消费工程 → 断言
        # wwwroot 资源名（含 app.min.js 这类含点文件名）→ 旧写法不重复嵌入 → 可显式关掉。
        # 不接进来的话，改动 targets 只能等发布后在某个消费方那里以"页面 404 白屏"的形式暴露——
        # 那正是这份 targets 要消灭的静默失败。脚本自带断言与退出码。
        shell: pwsh
        run: pwsh tools/verify-pack.ps1

  compile-windows:
    # 与 compile-linux / compile-macos 同属"编译并产出可执行产物"这一组；
    # Windows 侧这里额外检查 AOT 产物是否存在与大小（smoke-windows 依赖它）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish samples/OrielDemo -c Release -r win-x64 -v minimal

      - name: Check output
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/publish/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "AOT output missing: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Output "AOT exe size: $([math]::Round($size, 1)) MB"

  compile-macos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for osx-arm64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-arm64 -c Release --no-self-contained

      - name: Compile for osx-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-x64 -c Release --no-self-contained

  compile-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for linux-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-x64 -c Release --no-self-contained

      - name: Publish AOT Linux
        run: dotnet publish samples/OrielDemo -c Release -r linux-x64 -v minimal

  # 原先另有一个 aot-macos job（发布 demo 的 osx-arm64 + osx-x64）。它与 smoke-macos 重复了
  # 一次完整的 osx-arm64 AOT 发布（各自 restore → ilc → link），故合并进 smoke-macos：
  # arm64 由 tools/verify-macos.sh 发布——同一份产物既发布又用于运行验证；x64 作为"非本机架构
  # 的发布能力"验证，留在该 job 末尾单独跑。

  smoke-linux:
    runs-on: ubuntu-latest
    needs: [compile-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # x11-utils 提供 xwininfo（窗口断言）、imagemagick 提供 import（截图）；
          # zlib1g-dev/clang 是 Native AOT 的前置（runner 通常已带，显式列出以免依赖镜像）；
          # libnotify-bin 提供真的 notify-send（通知投递路径），python3-dbus/python3-gi 供
          # tools/fake-notification-service.py 顶替无头环境里缺席的通知守护。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb x11-utils imagemagick zlib1g-dev clang libnotify-bin python3-dbus python3-gi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Smoke run with evidence
        # 真取证（tools/verify-linux.sh）：AOT 发布产物 → 断言进程存活 + WebKit 子进程 +
        # X 窗口存在 → 截窗口图与整屏图上传 artifact 供人眼确认。取代了原先"timeout 后
        # 只看退出码是否为 124"的弱断言——那种断言只能证明进程没崩，证明不了窗口真的创建、
        # 内嵌资源真的加载、IPC 真的往返。
        # CI 只有 X11（xvfb 里没有 Wayland），故固定 --backend x11；另外 xvfb 下没有窗口
        # 管理器，所以最大化/拖动这类依赖 WM 的行为不在覆盖范围内。
        # xvfb 下仍会出现两条历史噪音——AT-SPI 找不到 org.a11y.Bus、libEGL 报 no DRI3——
        # 它们不影响判定，最终以脚本末尾的机器结论为准。
        run: xvfb-run -a bash tools/verify-linux.sh --backend x11 --out "$RUNNER_TEMP/linux-verify-out"

      - name: Self-tests (navigation / IPC / clipboard)
        # 机器断言：导航（跳转 / 后退 / 前进 / 刷新 / 失败）、IPC（console 转发、postMessage、
        # EmitEvent 闭环）与剪贴板（文本与 HTML 写→读回）。都不依赖人眼，以日志里的结论行判定。
        # xvfb 里没有窗口管理器，但导航、IPC 与剪贴板都不经过 WM，所以在这条路径上有效。
        # 剪贴板自检会覆盖系统剪贴板内容——CI 环境无人使用剪贴板，安全。
        run: |
          demo=samples/OrielDemo/bin/Release/net10.0/linux-x64/publish/OrielDemo
          for mode in nav ipc clipboard capability multiwindow; do
            log="$RUNNER_TEMP/selftest-$mode.log"
            xvfb-run -a "$demo" --selftest "$mode" > "$log" 2>&1
            code=$?
            verdict="$(grep -E '^(NAV|IPC|CLIPBOARD|CAPABILITY|MULTIWINDOW)-SELFTEST: ' "$log" | tail -1 || true)"
            echo "----- selftest $mode（退出码 $code）$verdict -----"
            sed 's/^/  /' "$log"
            # 判定以日志里的结论行为准（与 macOS 一致）：应用的退出方式各平台不同，
            # 退出码未必可靠地表达自检结果——macOS 上就出现过"结论 FAIL 但退出码 0"。
            if [[ "$verdict" != *PASS* ]]; then
              echo "::error::selftest $mode 未通过（结论行：${verdict:-无}）"
              exit 1
            fi
          done

          # 主题：深浅两条路径都要走到——用 GTK_THEME（GTK 认可的入口）分别跑，并断言两次结论**不同**。
          # 只跑一次只能证明"读得到主题"，证明不了"深浅判得对"；同一进程内又改不了系统主题，
          # 所以只能这样造值。
          pkill -x OrielDemo 2>/dev/null || true
          theme_light=""
          theme_dark=""
          for pair in "light:" "dark:Adwaita:dark"; do
            label="${pair%%:*}"
            value="${pair#*:}"
            log="$RUNNER_TEMP/theme-$label.log"
            GTK_THEME="$value" xvfb-run -a "$demo" --selftest theme > "$log" 2>&1
            verdict="$(grep -E '^THEME-SELFTEST: ' "$log" | tail -1 || true)"
            echo "----- theme=$label（GTK_THEME='$value'）$verdict -----"
            sed 's/^/  /' "$log"
            if [[ "$verdict" != *PASS* ]]; then
              echo "::error::selftest theme 未通过（$label，结论行：${verdict:-无}）"
              exit 1
            fi
            if [ "$label" = "light" ]; then theme_light="$verdict"; else theme_dark="$verdict"; fi
          done
          if [ "$theme_light" = "$theme_dark" ]; then
            echo "::error::深浅两次得到相同结论（$theme_light）——主题判定没有真正区分两条路径"
            exit 1
          fi

          # 单实例：这一项没法单进程自证，起两个进程——第二个应立即成功退出并通知首实例，
          # 第一个应收到激活请求（首实例自己也带 15 秒看门狗，不会挂住）。
          pkill -x OrielDemo 2>/dev/null || true
          xvfb-run -a "$demo" --selftest single-instance > "$RUNNER_TEMP/si-primary.log" 2>&1 &
          si_primary=$!
          sleep 5
          si_start=$(date +%s)
          xvfb-run -a "$demo" --selftest single-instance > "$RUNNER_TEMP/si-secondary.log" 2>&1
          si_secondary_code=$?
          si_elapsed=$(( $(date +%s) - si_start ))
          wait "$si_primary"
          si_primary_code=$?
          echo "----- 单实例：第二实例 exit=$si_secondary_code（${si_elapsed}s）首实例 exit=$si_primary_code -----"
          sed 's/^/  /' "$RUNNER_TEMP/si-primary.log"
          sed 's/^/  /' "$RUNNER_TEMP/si-secondary.log"
          [ "$si_secondary_code" -eq 0 ] || { echo "::error::第二个实例退出码非 0（$si_secondary_code）"; exit 1; }
          [ "$si_elapsed" -lt 10 ] || { echo "::error::第二个实例没有立即退出（${si_elapsed}s）"; exit 1; }
          grep -q 'SINGLE-INSTANCE-SECONDARY' "$RUNNER_TEMP/si-secondary.log" \
            || { echo "::error::第二个实例没有通知首实例"; exit 1; }
          grep -q 'SINGLE-INSTANCE: PASS' "$RUNNER_TEMP/si-primary.log" \
            || { echo "::error::首实例没有收到激活请求"; exit 1; }

      - name: Shell integration (tray + notification) with evidence
        # 托盘与通知的取证（tools/verify-linux-shell.sh）：
        #  · 托盘：建托盘 + 设一份覆盖各形态的菜单（分隔线/勾选/禁用/子菜单/quit role），
        #    断言进程不崩——图标是否真的出现需要人眼，脚本会把这条边界明确写进结论。
        #  · 通知：真 notify-send → 会话总线 → 假通知服务（tools/fake-notification-service.py，
        #    无头环境没有通知守护），断言标题与正文**逐字符正确**。
        #    这样"通知确实发出去了、内容没在传参路上被改写"是机器可判定的，而不是"没报错"。
        # 复用上面已发布的产物（--no-publish），与 Self-tests 同一份二进制。
        # xvfb-run 是必需的：runner 没有显示，GTK 初始化会直接失败（前面的自检步骤同样套了它）。
        # 脚本内再起 dbus-run-session —— xvfb 与 dbus 各管一头，互不干扰。
        run: xvfb-run -a bash tools/verify-linux-shell.sh --no-publish --out "$RUNNER_TEMP/linux-shell-out"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-evidence
          path: |
            ${{ runner.temp }}/linux-verify-out
            ${{ runner.temp }}/linux-shell-out
          if-no-files-found: warn
          retention-days: 14

  smoke-windows:
    runs-on: windows-latest
    needs: [compile-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build demo
        run: dotnet build samples/OrielDemo -c Release -r win-x64

      - name: Smoke run
        # 进程存活 8 秒 = 窗口创建成功且消息循环在跑（CI runner 无交互桌面，
        # 不断言窗口可见性，只断言进程未因启动异常立即退出）。
        shell: pwsh
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "未找到 demo 可执行文件：$exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "demo 启动后立即退出，ExitCode=$($p.ExitCode)" }
          Write-Output "OK: 进程存活，消息循环运行中"
          Stop-Process -Id $p.Id -Force

      - name: Pack with Velopack and check the artifacts
        # 每 push 都跑：这是唯一"生成物会落到用户机器上"的一条路径，而它此前从没跑过。
        # 只做机器可判定的部分——打包成功、该有的产物都在、更新清单能被解析；
        # "真装一次"要静默装到 runner 上，那一步放进 ROADMAP 的人眼清单（见 API.md 的打包一节）。
        shell: pwsh
        run: |
          # 钉住主版本：vpk 的产物形态随版本变（原先钉 WiX v5 是同一个理由）
          dotnet tool install --global vpk --version 1.2.*
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          dotnet publish samples/OrielDemo -c Release -r win-x64 -p:DebugType=none -o dist/demo

          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0].Trim()
          vpk pack --packId OrielDemo --packVersion $version --packTitle "Oriel Demo" `
            --packAuthors "OrielWeb Contributors" --packDir dist/demo --outputDir dist/releases `
            --mainExe OrielDemo.exe --icon samples/OrielDemo/app.ico --msi --skip-updates -x -y
          if ($LASTEXITCODE -ne 0) { throw "vpk pack 失败（退出码 $LASTEXITCODE）" }

          # 更新包（*.nupkg）与更新清单（releases.*.json / assets.*.json / RELEASES*）都不要：
          # 本仓库不发更新源，清单还会指向一个已被删掉的包
          Get-ChildItem dist/releases -File | Where-Object {
            $_.Extension -in '.nupkg', '.json' -or $_.Name -like 'RELEASES*'
          } | Remove-Item -Force

          foreach ($name in @("OrielDemo-win-Setup.exe", "OrielDemo-win-Portable.zip", "OrielDemo-win.msi")) {
            if (-not (Test-Path "dist/releases/$name")) { throw "缺少产物 $name" }
          }
          # 清完之后目录里只该剩安装产物（这是"不该有更新包/清单"那条约定的可执行形式）
          $leftover = Get-ChildItem dist/releases -File | Where-Object { $_.Name -notlike 'OrielDemo-win*' }
          if ($leftover) { throw "release 目录里还有不该有的文件：$($leftover.Name -join ', ')" }
          $msi = Get-ChildItem dist/releases -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "没有产出 .msi（--msi）" }

          # 更新清单必须能解析且写着我们刚打的版本——UpdateManager 就是靠它找新版本
          $manifest = Get-Content dist/releases/releases.win.json -Raw | ConvertFrom-Json
          if (@($manifest.Assets).Count -lt 1) { throw "releases.win.json 里没有 Assets" }
          if (@($manifest.Assets)[0].Version -ne $version) {
            throw "更新清单里的版本是 $(@($manifest.Assets)[0].Version)，期望 $version"
          }
          Write-Output "OK：Velopack 产物齐备（含 $($msi.Name)），清单版本 $version"

      - name: Self-tests (navigation / IPC / clipboard)
        # 与 Linux 同款断言（见 smoke-linux 的说明）。刻意用 Start-Process 而不是 & 调用，两个原因：
        #  1) pwsh 的 $LASTEXITCODE 在 & 调用之后仍可能是上一条原生命令的值、甚至未定义（$null），
        #     而 $null -ne 0 为真——第一次接进来时就是这样被误报成失败的（步骤 1 秒内失败）；
        #  2) 自检输出必须落到 CI 日志里，失败时才看得到是哪一项断言挂了。GUI 子系统下 & 的
        #     重定向抓不到原生 stdout（本机实测过），Start-Process 的显式管道才行。
        shell: pwsh
        run: |
          $demo = "samples/OrielDemo/bin/Release/net10.0/win-x64/OrielDemo.exe"
          # 主题只跑一次：Windows 上没有像 GTK_THEME 那样可靠的"造值"入口（改注册表会影响 runner
          # 的其它状态），所以这里只验证"读得到 + 事件通道通"，深/浅判得对由 smoke-linux 的双路径覆盖。
          foreach ($mode in @("nav", "ipc", "clipboard", "theme", "capability", "multiwindow")) {
            $out = "$env:RUNNER_TEMP\selftest-$mode.out.txt"
            $err = "$env:RUNNER_TEMP\selftest-$mode.err.txt"
            $p = Start-Process -FilePath $demo -ArgumentList @("--selftest", $mode) -Wait -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
            Write-Output "----- selftest $mode（退出码 $($p.ExitCode)）-----"
            if (Test-Path $out) { Get-Content $out -Encoding UTF8 | Write-Output }
            if (Test-Path $err) { Get-Content $err -Encoding UTF8 | Write-Output }
            # 判定以日志里的结论行为准（与 Linux / macOS 一致），退出码只作为附加信息。
            $verdict = ""
            if (Test-Path $out) {
              $last = Select-String -Path $out -Pattern '^(NAV|IPC|CLIPBOARD|THEME|CAPABILITY|MULTIWINDOW)-SELFTEST: ' | Select-Object -Last 1
              if ($last) { $verdict = $last.Line }
            }
            if ($verdict -notmatch 'PASS') {
              throw "selftest $mode 未通过（结论行：$(if ($verdict) { $verdict } else { '无' })）"
            }
          }

          # 单实例：起两个进程。第二个应"立即且成功地退出"并通知首实例，第一个应收到激活请求。
          Stop-Process -Name OrielDemo -Force -ErrorAction SilentlyContinue
          $primary = Start-Process -FilePath $demo -ArgumentList @("--selftest", "single-instance") -PassThru `
                     -RedirectStandardOutput "$env:RUNNER_TEMP\si-primary.log" `
                     -RedirectStandardError "$env:RUNNER_TEMP\si-primary.err"
          Start-Sleep -Seconds 5
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $secondary = Start-Process -FilePath $demo -ArgumentList @("--selftest", "single-instance") -Wait -PassThru `
                       -RedirectStandardOutput "$env:RUNNER_TEMP\si-secondary.log" `
                       -RedirectStandardError "$env:RUNNER_TEMP\si-secondary.err"
          $sw.Stop()
          $primary.WaitForExit(20000) | Out-Null
          Write-Output "----- 单实例：第二实例 exit=$($secondary.ExitCode)（$([int]$sw.Elapsed.TotalSeconds)s）首实例 exit=$($primary.ExitCode) -----"
          if (Test-Path "$env:RUNNER_TEMP\si-primary.log") { Get-Content "$env:RUNNER_TEMP\si-primary.log" -Encoding UTF8 | Write-Output }
          if (Test-Path "$env:RUNNER_TEMP\si-secondary.log") { Get-Content "$env:RUNNER_TEMP\si-secondary.log" -Encoding UTF8 | Write-Output }
          if ($secondary.ExitCode -ne 0) { throw "第二个实例退出码非 0：$($secondary.ExitCode)" }
          if ($sw.Elapsed.TotalSeconds -ge 10) { throw "第二个实例没有立即退出" }
          $primaryLog = Get-Content "$env:RUNNER_TEMP\si-primary.log" -Encoding UTF8 -Raw
          if ($primaryLog -notmatch 'SINGLE-INSTANCE: PASS') { throw "首实例没有收到激活请求" }

  smoke-macos:
    runs-on: macos-latest
    # 与 smoke-linux（needs compile-linux）、smoke-windows（needs compile-windows）对齐：
    # 库编译不过时不必让昂贵的 macOS runner 白跑一轮。代价是每次晚约 1 分钟才开始排队——
    # 本 job 自包含（verify-macos.sh 自己 publish），所以这是一处刻意取舍，不是疏忽。
    needs: [compile-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Smoke run with evidence
        # 托管 macOS runner 具备图形登录会话（2026-09-29 实测：managername=Aqua、/dev/console
        # 属主为 runner、WindowServer 在跑、能截到 1024x768 真实像素），
        # 所以这里能比 Windows 那条冒烟做得更硬：进程存活 + WebContent 子进程 + CGWindowList
        # 枚举到标题含 "Oriel Demo" 的窗口，三者都断言。截图作 artifact 上传，供人眼确认页面渲染、
        # 中文与 IPC 徽章（这三项没有宿主侧可观测信号）。
        # 判读标准与实现细节见 tools/verify-macos.sh 头部注释。
        run: bash tools/verify-macos.sh --out "$RUNNER_TEMP/macos-verify-out"

      - name: Publish AOT macOS x64
        # 非本机架构的 AOT 发布能力（arm64 那条已由 verify-macos.sh 覆盖，不再重复）。
        # 刻意放在运行验证之后：验证失败时优先暴露真正的问题，不必先等这一步跑完。
        run: dotnet publish samples/OrielDemo -c Release -r osx-x64 -v minimal

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-evidence
          path: ${{ runner.temp }}/macos-verify-out
