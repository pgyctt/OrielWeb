name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OrielWeb.slnx -c Release

      - name: Test
        run: dotnet test tests/OrielWeb.Tests -c Release --no-build

      - name: Format check
        # 格式/风格/分析器门禁（基准见 .editorconfig）；src/ 另已启用 TreatWarningsAsErrors
        run: dotnet format OrielWeb.slnx --verify-no-changes --verbosity minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Bridge JS tests
        # 三平台桥接脚本（windows/macos/linux）行为一致性；P0-2/P0-3 的回归防护。
        # 注意：必须显式给出文件路径——Node 把纯目录参数当作入口模块解析。
        run: node --test tests/bridge/bridge.test.mjs

  aot-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish samples/OrielDemo -c Release -r win-x64 -v minimal

      - name: Check output
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/publish/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "AOT output missing: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Output "AOT exe size: $([math]::Round($size, 1)) MB"

  compile-macos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for osx-arm64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-arm64 -c Release --no-self-contained

      - name: Compile for osx-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-x64 -c Release --no-self-contained

  compile-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for linux-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-x64 -c Release --no-self-contained

      - name: Publish AOT Linux
        run: dotnet publish samples/OrielDemo -c Release -r linux-x64 -v minimal

  aot-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT macOS ARM64
        run: dotnet publish samples/OrielDemo -c Release -r osx-arm64 -v minimal

      - name: Publish AOT macOS x64
        run: dotnet publish samples/OrielDemo -c Release -r osx-x64 -v minimal

  smoke-linux:
    runs-on: ubuntu-latest
    needs: [compile-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build demo
        run: dotnet build samples/OrielDemo -c Release -r linux-x64

      - name: Smoke run
        # 进程存活到超时（退出码 124）= 窗口创建成功且消息循环在跑。
        # timeout 的判定方式对"启动即崩溃"（非 124）与"卡死"（124）都能区分。
        # 注意：B-1（STA 检查）修复前本步骤必然失败——进程会因 Unix 上
        # ApartmentState 恒为 Unknown 直接抛异常退出，这是该缺陷的回归证据。
        run: |
          set +e
          timeout 20s xvfb-run -a dotnet run --project samples/OrielDemo -c Release -r linux-x64 --no-build
          code=$?
          echo "exit=$code"
          test $code -eq 124

  smoke-windows:
    runs-on: windows-latest
    needs: [aot-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build demo
        run: dotnet build samples/OrielDemo -c Release -r win-x64

      - name: Smoke run
        # 进程存活 8 秒 = 窗口创建成功且消息循环在跑（CI runner 无交互桌面，
        # 不断言窗口可见性，只断言进程未因启动异常立即退出）。
        shell: pwsh
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "未找到 demo 可执行文件：$exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "demo 启动后立即退出，ExitCode=$($p.ExitCode)" }
          Write-Output "OK: 进程存活，消息循环运行中"
          Stop-Process -Id $p.Id -Force
