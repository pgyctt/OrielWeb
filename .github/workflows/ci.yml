name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发：基准 job 需要（它不在 PR 上跑，见文件末尾的 benchmark job）。
  workflow_dispatch:

# 同一个 ref 的旧运行已经没有价值：新推送直接取代它（release.yml 刻意相反——发布要串行跑完）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # 默认超时是 6 小时。缺了这一行，一次 apt/网络挂起会把整个 run 拖到天亮——
    # 2026-10-23 就发生过：compile-linux 卡在 apt-get update 上 25 分钟仍无输出。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Build
        run: dotnet build OrielWeb.slnx -c Release

      - name: Test
        run: dotnet test tests/OrielWeb.Tests -c Release --no-build

      - name: Format check
        # 格式/风格/分析器门禁（基准见 .editorconfig）；src/ 另已启用 TreatWarningsAsErrors
        run: dotnet format OrielWeb.slnx --verify-no-changes --verbosity minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Bridge JS tests
        # 三平台桥接脚本（windows/macos/linux）行为一致性；P0-2/P0-3 的回归防护。
        # 注意：必须显式给出文件路径——Node 把纯目录参数当作入口模块解析。
        run: node --test tests/bridge/bridge.test.mjs

      - name: Migration fixture
        # "线格式桩要改成 mockIPC"这条配方必须是**可执行**的，否则它只是文档里的一段话。
        # 夹具覆盖三种情况：mockIPC 按本库命令名分支、仍调 plugin:fs|write_file 的失败形态、
        # 以及本文件自身不该残留多余的字面量。
        run: node --test tools/migration-drill/fixtures/mock-ipc.test.mjs

      - name: Frontend API tests
        # @orielweb/api 的单元测试（core / dpi / event / mocks）。它是页面侧公开 API 的载体，
        # 形状错了的表现是"前端迁移后行为不对"，而那种问题在 C# 侧一个断言都抓不到。
        # 无构建步骤（JS + JSDoc），所以直接跑 node --test。
        #
        # **`npm ci` 而不是只装 typescript**：`tauri-alignment` 测试要把
        # `@tauri-apps/api` 与官方插件当**参照实现**来机械比对导出面。
        # 那是"模块名与 Tauri 一一对应"这句话的取证——不装参照实现的话那份测试会跳过，
        # 而"跳过的门禁"等于没有门禁。
        working-directory: packages/api
        # **两步而不是一条 run 里两行**：Windows runner 的默认 shell 是 pwsh，
        # 多行 run 不会因前一条原生命令失败而中断（bash 有 -e，pwsh 没有）。
        # 2026-10-19 的 CI 就因此把"npm ci 503 失败 + npm test 通过"这步报成了绿色，
        # 直到下一步 npx 找不到本地 typescript 才炸——错误现场和真实原因隔了两步。
        run: npm ci

      - name: Frontend API tests
        working-directory: packages/api
        run: npm test

      - name: Frontend API typecheck
        # 类型检查是**门禁**而不是产物：包的 exports 直接指向 src/*.js，没有 dist/。
        # 关掉它的话，JSDoc 里的类型声明会慢慢与实现漂移，而漂移只在消费方 IDE 里可见。
        working-directory: packages/api
        # `--no-install`：typescript 缺失时**报错**，而不是去 registry 下同名包。
        # `tsc` 在 npm 上是一个无关的废弃包（2.0.4），npx 会装上它然后吐出
        # "This is not the tsc command you are looking for" —— 真正的病因（依赖没装好）
        # 被这行包装得像"类型检查不通过"。
        run: npx --no-install tsc -p . --noEmit

      - name: Frontend API types are up to date
        # types/ 是 `tsc -p tsconfig.types.json` 的产物，**提交进仓库**（包的 exports.types 指向它）。
        # 这里重新生成再比对：手改了 src 却忘了重新生成时，消费方会拿到过期的 .d.ts，
        # 而症状是"IDE 显示的方法签名与运行期不一致"——极难归因。宁可在 PR 上红。
        #
        # 为什么不干脆在发布时生成：那样漂移只会在 publish 那一刻才被发现，
        # 而那时已经没有办法 review 差异了。
        run: |
          cd packages/api
          npx --no-install tsc -p tsconfig.types.json
          cd ../..
          git diff --exit-code packages/api/types/

      - name: Package build logic (in-package MSBuild targets)
        # 包内 buildTransitive/OrielWeb.targets 的消费链路：打包 → 零配置消费工程 → 断言
        # wwwroot 资源名（含 app.min.js 这类含点文件名）→ 自带 LogicalName 的自声明不重复嵌入
        # → 旧写法（不带 LogicalName）必须在构建期被 ORIELWEB001 拦下 → 可显式关掉。
        # 不接进来的话，改动 targets 只能等发布后在某个消费方那里以"页面 404 白屏"的形式暴露——
        # 那正是这份 targets 要消灭的静默失败。脚本自带断言与退出码。
        shell: pwsh
        run: pwsh tools/verify-package.ps1

      - name: Platform matrix points at real jobs
        # README 的平台矩阵用 `ci:<job>` 标注每行状态的证据。引用一个不存在的 job 就红——
        # 2026-10-23 评审的教训：矩阵里一句"xvfb 冒烟"在仓库里找不到任何对应物，
        # 而它看起来完全像证据。把承诺变成可核对的引用，是唯一防得住这类漂移的办法。
        shell: pwsh
        run: pwsh tools/verify-matrix.ps1

  compile-windows:
    # 与 compile-linux / compile-macos 同属"编译并产出可执行产物"这一组；
    # Windows 侧这里额外检查 AOT 产物是否存在与大小（smoke-windows 依赖它）。
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Publish AOT
        run: dotnet publish samples/OrielDemo -c Release -r win-x64 -v minimal

      - name: Check output
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/publish/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "AOT output missing: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Output "AOT exe size: $([math]::Round($size, 1)) MB"

  compile-macos:
    # 这里只做 **IL 交叉编译**（不 AOT、不跑产物），Windows runner 就够且最便宜——
    # 真正的 macOS AOT 发布与运行验证在 smoke-macos（macos-latest）那条线里。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Compile for osx-arm64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-arm64 -c Release --no-self-contained

      - name: Compile for osx-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-x64 -c Release --no-self-contained

  compile-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # compile-linux 只需要编译依赖（不跑产物），包比 smoke 线少。
        # **外层 timeout 比 Acquire::Timeout 更要紧**：2026-10-23 两次 run 里，
        # 带 Acquire 超时的 apt-get update 照样挂了 25 分钟以上——卡住的不是 HTTP 传输，
        # 而是在等 mirror 应答/DNS/锁。Acquire 参数管不到这些，只有进程级硬超时能兜住。
        # 三次尝试之间隔 10 秒：镜像抖动通常是短时的，重试比重跑到天亮的 job 便宜。
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          APT_PACKAGES="libwebkit2gtk-4.1-dev libgtk-3-dev"
          for attempt in 1 2 3; do
            echo "::group::apt 第 ${attempt} 次"
            if timeout 240 sudo apt-get update $APT_OPTS &&
               timeout 360 sudo apt-get install -y $APT_OPTS $APT_PACKAGES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 ${attempt} 次 apt 失败，10 秒后重试" >&2
            sleep 10
          done
          echo "apt 连续三次失败，判定为 runner/镜像故障" >&2
          exit 1

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Compile for linux-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-x64 -c Release --no-self-contained

      - name: Compile for linux-arm64
        # README 的平台矩阵声称 arm64"编译通过"：没有这条线，该状态只能靠未入库的手动操作
        # 维持，会静默退化。IL 交叉编译（不做 AOT，成本极低）足够把"还能不能编译"钉住。
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-arm64 -c Release --no-self-contained

      - name: Publish AOT Linux
        run: dotnet publish samples/OrielDemo -c Release -r linux-x64 -v minimal

  # 原先另有一个 aot-macos job（发布 demo 的 osx-arm64 + osx-x64）。它与 smoke-macos 重复了
  # 一次完整的 osx-arm64 AOT 发布（各自 restore → ilc → link），故合并进 smoke-macos：
  # arm64 由 tools/verify-macos.sh 发布——同一份产物既发布又用于运行验证；x64 作为"非本机架构
  # 的发布能力"验证，留在该 job 末尾单独跑。

  smoke-linux:
    runs-on: ubuntu-latest
    needs: [compile-linux]
    # 为什么要有上限：2026-10-02 那次这一步卡在 azure.archive.ubuntu.com 的镜像重试上，
    # 一直挂到 6 小时才被取消（结论是 cancelled，日志末尾 "Error: The operation was canceled."）。
    # 没有上限时，一次镜像抖动就能吃掉几小时跑者配额，而且"卡住"与"在干活"在日志里看不出区别。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a shell trap that only bites macOS
        # 2026-10-02：tools/make-macos-app.sh 里 `echo "已生成 $APP（版本 ...）"` 在 release 的
        # macOS job 上炸出 "line 68: APP: unbound variable"，而同一个变量在上一行展开得好好的。
        # 原因：macOS 的 BSD libc 把 ≥0x80 的字节也算作字母数字，bash 3.2 于是把
        # 「$变量 + 紧跟的中文」整段当成变量名。Linux 的 glibc 不会，所以这条在 Linux 上
        # 永远看不到，`bash -n` 也查不出来（语法完全合法）——只有一条 grep 能挡。
        # 规则：变量后面紧跟非 ASCII 时必须写成 ${VAR} 分开。注释行不算。
        # .ps1 另有一条更窄的：PowerShell 只吞「紧跟中文字符」，全角标点（（、：、。）能正确
        # 终止变量名——上面那条实测出来的差别，所以两边的正则不一样。
        shell: bash
        run: |
          status=0
          if git grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' -- '*.sh' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::（.sh）变量后紧跟非 ASCII：macOS 上会被当成变量名的一部分，请写成 \${VAR}"
            status=1
          fi
          if git grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[\x{4e00}-\x{9fff}]' -- '*.ps1' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::（.ps1）变量后紧跟中文字符：PowerShell 会把它并入变量名，请写成 \${VAR}"
            status=1
          fi
          [[ $status -eq 0 ]] && echo "OK：没有「变量紧跟非 ASCII」的写法"
          exit $status

      - name: Install dependencies
        # x11-utils 提供 xwininfo（窗口断言）、imagemagick 提供 import（截图）；
        # zlib1g-dev/clang 是 Native AOT 的前置；libnotify-bin 提供真的 notify-send，
        # python3-dbus/python3-gi 供 tools/fake-notification-service.py 顶替无头环境的通知守护。
        # **外层 timeout 比 Acquire::Timeout 更要紧**：2026-10-23 两次 run 里，
        # 带 Acquire 超时的 apt-get update 照样挂了 25 分钟以上——卡住的不是 HTTP 传输，
        # 而是在等 mirror 应答/DNS/锁。Acquire 参数管不到这些，只有进程级硬超时能兜住。
        # 三次尝试之间隔 10 秒：镜像抖动通常是短时的，重试比重跑到天亮的 job 便宜。
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          APT_PACKAGES="libwebkit2gtk-4.1-dev libgtk-3-dev xvfb x11-utils imagemagick zlib1g-dev clang libnotify-bin python3-dbus python3-gi"
          for attempt in 1 2 3; do
            echo "::group::apt 第 ${attempt} 次"
            if timeout 240 sudo apt-get update $APT_OPTS &&
               timeout 360 sudo apt-get install -y $APT_OPTS $APT_PACKAGES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 ${attempt} 次 apt 失败，10 秒后重试" >&2
            sleep 10
          done
          echo "apt 连续三次失败，判定为 runner/镜像故障" >&2
          exit 1

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Start Xvfb and wait until it accepts connections
        # 不用 `xvfb-run -a`：它分配 display 号之后**立刻**执行命令，不等 X server 就绪。
        # 偶发症状是 `cannot open display :99`，同一份代码重跑即绿（39350302045 就是这么红的）。
        # 这种红会把"CI 绿"这件事的信息量削掉，所以这里自己起、自己等到能连上为止。
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then
              echo "Xvfb :99 就绪（第 ${i} 次探测，约 ${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb 30 秒内仍未就绪，下面是它的输出：" >&2
          cat "$RUNNER_TEMP/xvfb.log" >&2
          exit 1

      - name: Verify Linux (self-tests + shell evidence + smoke run)
        # 三个阶段一次跑完（脚本内部按阶段分节，失败时逐阶段给结论）：
        #   selftest —— 机器断言（导航/IPC/能力模型/多窗口/来源探针/线程归属/托盘/主题双路径/
        #               退出语义/单实例双进程）
        #   shell    —— 托盘与通知取证（真 notify-send → 会话总线 → 假通知服务，断言标题与
        #               正文逐字符正确；无头环境没有通知守护，见 tools/fake-notification-service.py）
        #   smoke    —— 运行取证（进程存活 + WebKit 子进程 + X 窗口断言 + 截图 artifact）
        # CI 只有 X11（xvfb 里没有 Wayland），故固定 --backend x11；xvfb 下没有窗口管理器，
        # 所以最大化/拖动这类依赖 WM 的行为不在覆盖范围内。
        # xvfb 下仍会出现两条历史噪音——AT-SPI 找不到 org.a11y.Bus、libEGL 报 no DRI3——
        # 它们不影响判定，最终以脚本末尾的机器结论为准。
        # 脚本内部自己起 dbus-run-session（通知服务与 demo 必须同一个会话总线）。
        env:
          # 固定 :99：上一步已确认它可连。脚本看到 DISPLAY 就不再走 xvfb-run 自举。
          DISPLAY: ':99'
        run: bash tools/verify-linux.sh --backend x11 --out "$RUNNER_TEMP/linux-verify-out"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-evidence
          path: |
            ${{ runner.temp }}/linux-verify-out
            ${{ runner.temp }}/linux-shell-out
          if-no-files-found: warn
          retention-days: 14

  smoke-windows:
    runs-on: windows-latest
    needs: [compile-windows]
    # 与 smoke-linux 同理：有上限，才不会一次环境抖动就吃掉几个小时配额
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Build demo
        run: dotnet build samples/OrielDemo -c Release -r win-x64

      - name: Verify Windows (smoke run + Velopack pack + self-tests)
        # 三个阶段一次跑完（脚本内部按阶段分节，失败时逐阶段给结论）：
        #   smoke    —— 进程存活 8 秒 = 窗口创建成功且消息循环在跑（runner 无交互桌面，
        #               不断言窗口可见性，只断言进程未因启动异常立即退出）
        #   pack     —— Velopack 打包成功、产物齐备、更新包与清单已按约定清除
        #   selftest —— 机器断言（导航/IPC/主题/能力模型/多窗口/来源探针/线程归属/托盘/
        #               退出语义的"结论行 + 退出码"双断言/单实例双进程）
        # 实现与判读标准全在 tools/verify-windows.ps1 里——内联在 workflow 里的脚本
        # 没法在本地跑、没法单独 review、diff 时也看不出改的是哪一段逻辑。
        #
        # **-Publish 而不是在这里先 publish**：`dotnet publish -o dist/demo` 会把
        # bin/Release/net10.0/win-x64/ 重建成 OrielDemo.dll + deps/runtimeconfig——
        # 于是冒烟阶段要找的那个 IL 构建产物 `OrielDemo.exe` **在 publish 之后就不存在了**。
        # 顺序必须是「先冒烟（用 IL 构建）→ 再发布 AOT（给打包与自检用）」，
        # 这也是原来那三步的次序。交给脚本自己按阶段做，就不会再被顺序绊住。
        shell: pwsh
        run: pwsh tools/verify-windows.ps1 -Publish
  smoke-macos:
    runs-on: macos-latest
    # 与 smoke-linux（needs compile-linux）、smoke-windows（needs compile-windows）对齐：
    # 库编译不过时不必让昂贵的 macOS runner 白跑一轮。代价是每次晚约 1 分钟才开始排队——
    # 本 job 自包含（verify-macos.sh 自己 publish），所以这是一处刻意取舍，不是疏忽。
    needs: [compile-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Smoke run with evidence
        # 托管 macOS runner 具备图形登录会话（2026-09-29 实测：managername=Aqua、/dev/console
        # 属主为 runner、WindowServer 在跑、能截到 1024x768 真实像素），
        # 所以这里能比 Windows 那条冒烟做得更硬：进程存活 + WebContent 子进程 + CGWindowList
        # 枚举到标题含 "Oriel Demo" 的窗口，三者都断言。截图作 artifact 上传，供人眼确认页面渲染、
        # 中文与 IPC 徽章（这三项没有宿主侧可观测信号）。
        # 判读标准与实现细节见 tools/verify-macos.sh 头部注释。
        run: bash tools/verify-macos.sh --out "$RUNNER_TEMP/macos-verify-out"

      - name: Publish AOT macOS x64
        # 非本机架构的 AOT 发布能力（arm64 那条已由 verify-macos.sh 覆盖，不再重复）。
        # 刻意放在运行验证之后：验证失败时优先暴露真正的问题，不必先等这一步跑完。
        run: dotnet publish samples/OrielDemo -c Release -r osx-x64 -v minimal

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-evidence
          path: ${{ runner.temp }}/macos-verify-out
          if-no-files-found: warn
          retention-days: 14

  smoke-linux-arm64:
    # Linux arm64 此前只有 IL 交叉编译（compile-linux 的第二个 RID），
    # 从来没有在 arm64 上真正跑起来过——README 却写着"xvfb 冒烟"。
    # ubuntu-24.04-arm 对公开仓库免费且是原生 arm64，依赖包与 x64 同名，
    # 所以这里跑与 smoke-linux 同一套 selftest。
    runs-on: ubuntu-24.04-arm
    needs: [compile-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # arm64 runner 上同样是原生 apt，依赖包与 x64 同名。
        # **外层 timeout 比 Acquire::Timeout 更要紧**：2026-10-23 两次 run 里，
        # 带 Acquire 超时的 apt-get update 照样挂了 25 分钟以上——卡住的不是 HTTP 传输，
        # 而是在等 mirror 应答/DNS/锁。Acquire 参数管不到这些，只有进程级硬超时能兜住。
        # 三次尝试之间隔 10 秒：镜像抖动通常是短时的，重试比重跑到天亮的 job 便宜。
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          APT_PACKAGES="libwebkit2gtk-4.1-dev libgtk-3-dev xvfb x11-utils zlib1g-dev clang"
          for attempt in 1 2 3; do
            echo "::group::apt 第 ${attempt} 次"
            if timeout 240 sudo apt-get update $APT_OPTS &&
               timeout 360 sudo apt-get install -y $APT_OPTS $APT_PACKAGES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 ${attempt} 次 apt 失败，10 秒后重试" >&2
            sleep 10
          done
          echo "apt 连续三次失败，判定为 runner/镜像故障" >&2
          exit 1

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Start Xvfb and wait until it accepts connections
        # 与 smoke-linux 同款等待：xvfb-run -a 不等 X server 就绪，会偶发 "cannot open display"。
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then
              echo "Xvfb :99 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb 30 秒内仍未就绪：" >&2
          cat "$RUNNER_TEMP/xvfb.log" >&2
          exit 1

      - name: Self-tests (arm64)
        # 只跑 selftest：托盘/通知取证（shell 阶段）依赖 dbus 与通知守护，
        # 与架构无关，x64 那条线已经覆盖，这里不值得再配一套。
        env:
          DISPLAY: ':99'
        run: bash tools/verify-linux.sh --stages selftest --backend x11 --out "$RUNNER_TEMP/linux-arm64-out"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-evidence
          path: ${{ runner.temp }}/linux-arm64-out
          if-no-files-found: warn
          retention-days: 14

  smoke-macos-x64:
    # macOS x64 此前**只编译不运行**。0.4.3 的 NSRect ABI 崩溃（Intel 上建第一个窗口就
    # SIGABRT）正是这类盲区的产物：CI 只跑 osx-arm64，它永远看不见。
    # macos-13 已于 2025-12-04 退役，Intel 的替代品是 macos-15-intel（可用到 2027 年秋）。
    runs-on: macos-15-intel
    needs: [compile-macos]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Smoke run with evidence (Intel)
        # 复用 arm64 那条线的全套：publish → 组装 .app → 自检 → 截图。
        # 脚本按 uname -m 选 RID，在 Intel 上自动走 osx-x64，无需额外参数。
        run: bash tools/verify-macos.sh --out "$RUNNER_TEMP/macos-x64-out"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-evidence
          path: ${{ runner.temp }}/macos-x64-out
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    # 只在 main 与手动触发时跑。**PR 上不跑**：共享 runner 的噪声足以让"回归 20%"
    # 变成狼来了，而一条会误报的门禁最终一定会被忽略。
    # 先只记录、不设阈值——等 main 上积累十几次样本，再定"回归 > 20% 告警"。
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-nuget

      - name: Run benchmarks
        # 四个基准各用独立进程（BDN 默认工具链）。注册表是进程级的，
        # 分成两个类正是为了让它互不污染——同一进程先注册 1000 条再测 1 条，测的就不是 1 条。
        run: dotnet run -c Release --project benchmarks/OrielWeb.Benchmarks -- --filter '*' --exporters markdown

      - name: Publish trend to job summary
        # 表进 Step Summary，历史就在 Actions 页面按 run 翻——不引入外部服务，
        # 也不需要 gh-pages 分支。
        shell: pwsh
        run: |
          $files = Get-ChildItem BenchmarkDotNet.Artifacts/results/*.md -ErrorAction SilentlyContinue
          if (-not $files) { throw "基准没有产出 markdown：BDN 可能没跑起来" }
          "## 基准结果" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($file in $files) {
            Get-Content $file.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BenchmarkDotNet.Artifacts
          if-no-files-found: warn
          retention-days: 30
