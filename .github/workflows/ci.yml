name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个 ref 的旧运行已经没有价值：新推送直接取代它（release.yml 刻意相反——发布要串行跑完）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OrielWeb.slnx -c Release

      - name: Test
        run: dotnet test tests/OrielWeb.Tests -c Release --no-build

      - name: Format check
        # 格式/风格/分析器门禁（基准见 .editorconfig）；src/ 另已启用 TreatWarningsAsErrors
        run: dotnet format OrielWeb.slnx --verify-no-changes --verbosity minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Bridge JS tests
        # 三平台桥接脚本（windows/macos/linux）行为一致性；P0-2/P0-3 的回归防护。
        # 注意：必须显式给出文件路径——Node 把纯目录参数当作入口模块解析。
        run: node --test tests/bridge/bridge.test.mjs

      - name: Package build logic (in-package MSBuild targets)
        # 包内 buildTransitive/OrielWeb.targets 的消费链路：打包 → 零配置消费工程 → 断言
        # wwwroot 资源名（含 app.min.js 这类含点文件名）→ 自带 LogicalName 的自声明不重复嵌入
        # → 旧写法（不带 LogicalName）必须在构建期被 ORIELWEB001 拦下 → 可显式关掉。
        # 不接进来的话，改动 targets 只能等发布后在某个消费方那里以"页面 404 白屏"的形式暴露——
        # 那正是这份 targets 要消灭的静默失败。脚本自带断言与退出码。
        shell: pwsh
        run: pwsh tools/verify-package.ps1

  compile-windows:
    # 与 compile-linux / compile-macos 同属"编译并产出可执行产物"这一组；
    # Windows 侧这里额外检查 AOT 产物是否存在与大小（smoke-windows 依赖它）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish samples/OrielDemo -c Release -r win-x64 -v minimal

      - name: Check output
        run: |
          $exe = "samples/OrielDemo/bin/Release/net10.0/win-x64/publish/OrielDemo.exe"
          if (-not (Test-Path $exe)) { throw "AOT output missing: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Output "AOT exe size: $([math]::Round($size, 1)) MB"

  compile-macos:
    # 这里只做 **IL 交叉编译**（不 AOT、不跑产物），Windows runner 就够且最便宜——
    # 真正的 macOS AOT 发布与运行验证在 smoke-macos（macos-latest）那条线里。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for osx-arm64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-arm64 -c Release --no-self-contained

      - name: Compile for osx-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r osx-x64 -c Release --no-self-contained

  compile-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile for linux-x64
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-x64 -c Release --no-self-contained

      - name: Compile for linux-arm64
        # README 的平台矩阵声称 arm64"编译通过"：没有这条线，该状态只能靠未入库的手动操作
        # 维持，会静默退化。IL 交叉编译（不做 AOT，成本极低）足够把"还能不能编译"钉住。
        run: dotnet build src/OrielWeb/OrielWeb.csproj -r linux-arm64 -c Release --no-self-contained

      - name: Publish AOT Linux
        run: dotnet publish samples/OrielDemo -c Release -r linux-x64 -v minimal

  # 原先另有一个 aot-macos job（发布 demo 的 osx-arm64 + osx-x64）。它与 smoke-macos 重复了
  # 一次完整的 osx-arm64 AOT 发布（各自 restore → ilc → link），故合并进 smoke-macos：
  # arm64 由 tools/verify-macos.sh 发布——同一份产物既发布又用于运行验证；x64 作为"非本机架构
  # 的发布能力"验证，留在该 job 末尾单独跑。

  smoke-linux:
    runs-on: ubuntu-latest
    needs: [compile-linux]
    # 为什么要有上限：2026-10-02 那次这一步卡在 azure.archive.ubuntu.com 的镜像重试上，
    # 一直挂到 6 小时才被取消（结论是 cancelled，日志末尾 "Error: The operation was canceled."）。
    # 没有上限时，一次镜像抖动就能吃掉几小时跑者配额，而且"卡住"与"在干活"在日志里看不出区别。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a shell trap that only bites macOS
        # 2026-10-02：tools/make-macos-app.sh 里 `echo "已生成 $APP（版本 ...）"` 在 release 的
        # macOS job 上炸出 "line 68: APP: unbound variable"，而同一个变量在上一行展开得好好的。
        # 原因：macOS 的 BSD libc 把 ≥0x80 的字节也算作字母数字，bash 3.2 于是把
        # 「$变量 + 紧跟的中文」整段当成变量名。Linux 的 glibc 不会，所以这条在 Linux 上
        # 永远看不到，`bash -n` 也查不出来（语法完全合法）——只有一条 grep 能挡。
        # 规则：变量后面紧跟非 ASCII 时必须写成 ${VAR} 分开。注释行不算。
        # .ps1 另有一条更窄的：PowerShell 只吞「紧跟中文字符」，全角标点（（、：、。）能正确
        # 终止变量名——上面那条实测出来的差别，所以两边的正则不一样。
        shell: bash
        run: |
          status=0
          if git grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' -- '*.sh' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::（.sh）变量后紧跟非 ASCII：macOS 上会被当成变量名的一部分，请写成 \${VAR}"
            status=1
          fi
          if git grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[\x{4e00}-\x{9fff}]' -- '*.ps1' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::（.ps1）变量后紧跟中文字符：PowerShell 会把它并入变量名，请写成 \${VAR}"
            status=1
          fi
          [[ $status -eq 0 ]] && echo "OK：没有「变量紧跟非 ASCII」的写法"
          exit $status

      - name: Install dependencies
        run: |
          # apt 自带超时与重试：上面那次挂起就发生在本步
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          sudo apt-get update $APT_OPTS
          # x11-utils 提供 xwininfo（窗口断言）、imagemagick 提供 import（截图）；
          # zlib1g-dev/clang 是 Native AOT 的前置（runner 通常已带，显式列出以免依赖镜像）；
          # libnotify-bin 提供真的 notify-send（通知投递路径），python3-dbus/python3-gi 供
          # tools/fake-notification-service.py 顶替无头环境里缺席的通知守护。
          sudo apt-get install -y $APT_OPTS libwebkit2gtk-4.1-dev libgtk-3-dev xvfb x11-utils imagemagick zlib1g-dev clang libnotify-bin python3-dbus python3-gi

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Linux (self-tests + shell evidence + smoke run)
        # 三个阶段一次跑完（脚本内部按阶段分节，失败时逐阶段给结论）：
        #   selftest —— 机器断言（导航/IPC/能力模型/多窗口/来源探针/线程归属/托盘/主题双路径/
        #               退出语义/单实例双进程）
        #   shell    —— 托盘与通知取证（真 notify-send → 会话总线 → 假通知服务，断言标题与
        #               正文逐字符正确；无头环境没有通知守护，见 tools/fake-notification-service.py）
        #   smoke    —— 运行取证（进程存活 + WebKit 子进程 + X 窗口断言 + 截图 artifact）
        # CI 只有 X11（xvfb 里没有 Wayland），故固定 --backend x11；xvfb 下没有窗口管理器，
        # 所以最大化/拖动这类依赖 WM 的行为不在覆盖范围内。
        # xvfb 下仍会出现两条历史噪音——AT-SPI 找不到 org.a11y.Bus、libEGL 报 no DRI3——
        # 它们不影响判定，最终以脚本末尾的机器结论为准。
        # 脚本内部自己起 dbus-run-session（通知服务与 demo 必须同一个会话总线）。
        run: xvfb-run -a bash tools/verify-linux.sh --backend x11 --out "$RUNNER_TEMP/linux-verify-out"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-evidence
          path: |
            ${{ runner.temp }}/linux-verify-out
            ${{ runner.temp }}/linux-shell-out
          if-no-files-found: warn
          retention-days: 14

  smoke-windows:
    runs-on: windows-latest
    needs: [compile-windows]
    # 与 smoke-linux 同理：有上限，才不会一次环境抖动就吃掉几个小时配额
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build demo
        run: dotnet build samples/OrielDemo -c Release -r win-x64

      - name: Verify Windows (smoke run + Velopack pack + self-tests)
        # 三个阶段一次跑完（脚本内部按阶段分节，失败时逐阶段给结论）：
        #   smoke    —— 进程存活 8 秒 = 窗口创建成功且消息循环在跑（runner 无交互桌面，
        #               不断言窗口可见性，只断言进程未因启动异常立即退出）
        #   pack     —— Velopack 打包成功、产物齐备、更新包与清单已按约定清除
        #   selftest —— 机器断言（导航/IPC/主题/能力模型/多窗口/来源探针/线程归属/托盘/
        #               退出语义的"结论行 + 退出码"双断言/单实例双进程）
        # 实现与判读标准全在 tools/verify-windows.ps1 里——内联在 workflow 里的脚本
        # 没法在本地跑、没法单独 review、diff 时也看不出改的是哪一段逻辑。
        #
        # **-Publish 而不是在这里先 publish**：`dotnet publish -o dist/demo` 会把
        # bin/Release/net10.0/win-x64/ 重建成 OrielDemo.dll + deps/runtimeconfig——
        # 于是冒烟阶段要找的那个 IL 构建产物 `OrielDemo.exe` **在 publish 之后就不存在了**。
        # 顺序必须是「先冒烟（用 IL 构建）→ 再发布 AOT（给打包与自检用）」，
        # 这也是原来那三步的次序。交给脚本自己按阶段做，就不会再被顺序绊住。
        shell: pwsh
        run: pwsh tools/verify-windows.ps1 -Publish
  smoke-macos:
    runs-on: macos-latest
    # 与 smoke-linux（needs compile-linux）、smoke-windows（needs compile-windows）对齐：
    # 库编译不过时不必让昂贵的 macOS runner 白跑一轮。代价是每次晚约 1 分钟才开始排队——
    # 本 job 自包含（verify-macos.sh 自己 publish），所以这是一处刻意取舍，不是疏忽。
    needs: [compile-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        # 每个 job 都要 restore，缓存 ~/.nuget/packages 能省掉大半下载时间。
        # 键取 csproj 与 Directory.Build.props 的哈希：依赖一变就换键，restore-keys 兜住回退。
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Smoke run with evidence
        # 托管 macOS runner 具备图形登录会话（2026-09-29 实测：managername=Aqua、/dev/console
        # 属主为 runner、WindowServer 在跑、能截到 1024x768 真实像素），
        # 所以这里能比 Windows 那条冒烟做得更硬：进程存活 + WebContent 子进程 + CGWindowList
        # 枚举到标题含 "Oriel Demo" 的窗口，三者都断言。截图作 artifact 上传，供人眼确认页面渲染、
        # 中文与 IPC 徽章（这三项没有宿主侧可观测信号）。
        # 判读标准与实现细节见 tools/verify-macos.sh 头部注释。
        run: bash tools/verify-macos.sh --out "$RUNNER_TEMP/macos-verify-out"

      - name: Publish AOT macOS x64
        # 非本机架构的 AOT 发布能力（arm64 那条已由 verify-macos.sh 覆盖，不再重复）。
        # 刻意放在运行验证之后：验证失败时优先暴露真正的问题，不必先等这一步跑完。
        run: dotnet publish samples/OrielDemo -c Release -r osx-x64 -v minimal

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-evidence
          path: ${{ runner.temp }}/macos-verify-out
          if-no-files-found: warn
          retention-days: 14
